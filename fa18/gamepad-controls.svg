<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">F/A-18 Interceptor gamepad controls</title>
  <desc id="description">Xbox-style flight controls. Left stick pitch and roll, click for gear. Triggers rudder, bumpers throttle. A fire, B flare, X target, Y weapon. D-pad up radar, down brake, left chaff, right ECM. Right stick cockpit look, click for hook. Menu pause. Tap View for map; hold View with A external view, X HUD, Y maximum normal thrust, RB afterburner, LB idle, D-pad up zoom in, down zoom out, B rescue pod, or right stick click eject.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#344658"/><stop offset="1" stop-color="#192738"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b2938"/><stop offset="1" stop-color="#101c29"/>
    </linearGradient>
    <radialGradient id="stick">
      <stop stop-color="#43576b"/><stop offset=".7" stop-color="#293c50"/><stop offset="1" stop-color="#172536"/>
    </radialGradient>
    <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .heading { fill: #f4f7fc; font-weight: 700; font-size: 26px; letter-spacing: 1px; }
      .label { fill: #e2eaf4; font-size: 25px; }
      .note { fill: #9eafc3; font-size: 21px; }
      .small { fill: #a9bbce; font-size: 18px; }
      .leader { fill: none; stroke: #617e99; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .key { fill: #edf5ff; font-weight: 700; font-size: 22px; text-anchor: middle; }
      .pad-label { fill: #c2d3e5; font-weight: 700; font-size: 20px; text-anchor: middle; }
      .chord { fill: #ffbf69; font-weight: 700; font-size: 21px; }
      .action { fill: #eef3fb; font-size: 26px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1600" height="1200" rx="24" fill="#0a111c"/>
  <path d="M40 110H1560M40 830H1560" stroke="#26364b" stroke-width="2"/>
  <text x="60" y="58" fill="#ffbf69" font-size="22" font-weight="700" letter-spacing="4">F/A-18 INTERCEPTOR</text>
  <text x="60" y="96" fill="#f3f7ff" font-size="32" font-weight="700">GAMEPAD CONTROLS</text>
  <text x="1540" y="82" class="note" text-anchor="end">Xbox-style default profile</text>

  <!-- Callouts are separate from the controller artwork for readable labels. -->
  <g class="leader">
    <path d="M350 186H432L538 248"/>
    <path d="M350 267H444L548 302"/>
    <path d="M360 382H470L560 420"/>
    <path d="M360 475H482L604 448"/>
    <path d="M360 577H638L710 552"/>
    <path d="M1250 186H1168L1062 248"/>
    <path d="M1250 267H1156L1052 302"/>
    <path d="M1208 430H1104"/>
    <path d="M1208 597H1070L980 552"/>
    <path d="M760 378V680L660 727"/>
    <path d="M840 378V680L960 727"/>
  </g>

  <!-- Xbox-style silhouette, offset sticks, D-pad, bumpers and triggers. -->
  <g filter="url(#shadow)">
    <path d="M492 293L510 237Q530 209 569 224L608 282Z" fill="#223347" stroke="#63809a" stroke-width="2"/>
    <path d="M1108 293L1090 237Q1070 209 1031 224L992 282Z" fill="#223347" stroke="#63809a" stroke-width="2"/>
    <path d="M491 292Q550 261 635 279L650 317L478 330Z" fill="#142132" stroke="#7192af" stroke-width="2"/>
    <path d="M1109 292Q1050 261 965 279L950 317L1122 330Z" fill="#142132" stroke="#7192af" stroke-width="2"/>
    <path d="M605 294Q800 266 995 294Q1101 291 1134 394L1200 600Q1220 687 1161 710Q1118 726 1080 682L980 588Q800 640 620 588L520 682Q482 726 439 710Q380 687 400 600L466 394Q499 291 605 294Z" fill="url(#body)" stroke="#667f98" stroke-width="3"/>
    <path d="M466 480L419 616Q409 668 447 684Q469 694 494 665L574 578Z" fill="url(#grip)"/>
    <path d="M1134 480L1181 616Q1191 668 1153 684Q1131 694 1106 665L1026 578Z" fill="url(#grip)"/>
    <path d="M621 313Q800 289 979 313" fill="none" stroke="#809ab2" stroke-opacity=".35" stroke-width="2"/>

    <circle cx="604" cy="420" r="71" fill="#101c2a" stroke="#5c758e" stroke-width="2"/>
    <circle cx="604" cy="420" r="56" fill="url(#stick)" stroke="#7d99b2" stroke-width="3"/>
    <circle cx="604" cy="420" r="43" fill="none" stroke="#9ab2c6" stroke-opacity=".2" stroke-dasharray="2 5" stroke-width="3"/>
    <path d="M604 396V444M580 420H628" stroke="#9fb9d1" stroke-opacity=".6" stroke-width="2"/>
    <text x="604" y="504" class="pad-label">L3</text>

    <circle cx="710" cy="552" r="66" fill="#112030" stroke="#4b647c" stroke-width="2"/>
    <path d="M690 501H730V532H761V572H730V603H690V572H659V532H690Z" fill="#31475e" stroke="#809bb5" stroke-width="2"/>
    <path d="M704 516L710 509L716 516M704 588L710 595L716 588M674 546L667 552L674 558M746 546L753 552L746 558" fill="none" stroke="#c1d2e3" stroke-width="2"/>

    <circle cx="960" cy="552" r="71" fill="#101c2a" stroke="#5c758e" stroke-width="2"/>
    <circle cx="960" cy="552" r="56" fill="url(#stick)" stroke="#7d99b2" stroke-width="3"/>
    <circle cx="960" cy="552" r="43" fill="none" stroke="#9ab2c6" stroke-opacity=".2" stroke-dasharray="2 5" stroke-width="3"/>
    <path d="M960 528V576M936 552H984" stroke="#9fb9d1" stroke-opacity=".6" stroke-width="2"/>
    <text x="960" y="636" class="pad-label">R3</text>

    <g stroke-width="2">
      <circle cx="1018" cy="357" r="26" fill="#422e14" stroke="#f7ca64"/>
      <circle cx="966" cy="409" r="26" fill="#173957" stroke="#76bbfa"/>
      <circle cx="1070" cy="409" r="26" fill="#4d2430" stroke="#f68e99"/>
      <circle cx="1018" cy="461" r="26" fill="#1b4339" stroke="#8ed8ad"/>
    </g>
    <text x="1018" y="365" class="key" style="fill:#f7ca64">Y</text>
    <text x="966" y="417" class="key" style="fill:#76bbfa">X</text>
    <text x="1070" y="417" class="key" style="fill:#f68e99">B</text>
    <text x="1018" y="469" class="key" style="fill:#8ed8ad">A</text>

    <rect x="734" y="356" width="52" height="44" rx="15" fill="#182638" stroke="#7e99b3"/>
    <path d="M748 369H763V380H748ZM756 375H771V386H756Z" fill="none" stroke="#d2dfed" stroke-width="2"/>
    <rect x="814" y="356" width="52" height="44" rx="15" fill="#182638" stroke="#7e99b3"/>
    <path d="M830 370H850M830 378H850M830 386H850" stroke="#d2dfed" stroke-width="2"/>
    <circle cx="800" cy="320" r="15" fill="#101c29" stroke="#6c8298"/>
    <path d="M800 309L803 317L813 322V325L802 323V330L800 328L798 330V323L787 325V322L797 317Z" fill="#ffbf69"/>
    <text x="548" y="255" class="pad-label">LT</text>
    <text x="1052" y="255" class="pad-label">RT</text>
    <text x="556" y="301" class="pad-label">LB</text>
    <text x="1044" y="301" class="pad-label">RB</text>
  </g>

  <!-- Normal flight actions. -->
  <text x="60" y="183" class="heading">LT</text><text x="124" y="183" class="label">Rudder left</text>
  <text x="60" y="264" class="heading">LB</text><text x="124" y="264" class="label">Throttle down</text>
  <text x="60" y="362" class="heading">LEFT STICK</text>
  <text x="60" y="397" class="label">Pitch / roll</text>
  <text x="60" y="428" class="small">Push forward: nose down</text>
  <text x="60" y="475" class="heading">L3</text><text x="124" y="475" class="label">Toggle gear</text>
  <text x="60" y="558" class="heading">D-PAD</text>
  <text x="60" y="595" class="label">↑ Radar range</text>
  <text x="60" y="633" class="label">↓ Brake / airbrake</text>
  <text x="60" y="671" class="label">← Chaff</text>
  <text x="60" y="709" class="label">→ ECM</text>

  <text x="1250" y="183" class="heading">RT</text><text x="1314" y="183" class="label">Rudder right</text>
  <text x="1250" y="264" class="heading">RB</text><text x="1314" y="264" class="label">Throttle up</text>
  <g font-size="25" font-weight="700" text-anchor="middle">
    <circle cx="1245" cy="352" r="20" fill="#422e14"/><text x="1245" y="361" fill="#f7ca64">Y</text>
    <circle cx="1245" cy="399" r="20" fill="#173957"/><text x="1245" y="408" fill="#76bbfa">X</text>
    <circle cx="1245" cy="446" r="20" fill="#4d2430"/><text x="1245" y="455" fill="#f68e99">B</text>
    <circle cx="1245" cy="493" r="20" fill="#1b4339"/><text x="1245" y="502" fill="#8ed8ad">A</text>
  </g>
  <text x="1280" y="361" class="label">Cycle weapon</text>
  <text x="1280" y="408" class="label">Next target</text>
  <text x="1280" y="455" class="label">Flare</text>
  <text x="1280" y="502" class="label">Fire (hold)</text>
  <text x="1210" y="578" class="heading">RIGHT STICK</text>
  <text x="1210" y="614" class="label">Cockpit look</text>
  <text x="1210" y="650" class="label">Click R3: toggle hook</text>
  <text x="1210" y="686" class="small">↑ Forward · ↓ Rear</text>
  <text x="1210" y="714" class="small">← Left · → Right</text>
  <text x="660" y="751" class="heading" text-anchor="middle">VIEW</text>
  <text x="660" y="786" class="label" text-anchor="middle">Tap: map</text>
  <text x="960" y="751" class="heading" text-anchor="middle">MENU</text>
  <text x="960" y="786" class="label" text-anchor="middle">Pause</text>

  <!-- Less frequent commands: explicit chords, kept off the flight HUD. -->
  <text x="60" y="887" fill="#ffbf69" font-size="29" font-weight="700">HOLD VIEW +</text>
  <text x="1540" y="884" class="note" text-anchor="end">Press View first. A combination will not open the map.</text>
  <g fill="#131f2e" stroke="#2b4055">
    <rect x="60" y="916" width="470" height="68" rx="10"/><rect x="565" y="916" width="470" height="68" rx="10"/><rect x="1070" y="916" width="470" height="68" rx="10"/>
    <rect x="60" y="998" width="470" height="68" rx="10"/><rect x="565" y="998" width="470" height="68" rx="10"/><rect x="1070" y="998" width="470" height="68" rx="10"/>
    <rect x="60" y="1080" width="470" height="68" rx="10"/><rect x="565" y="1080" width="470" height="68" rx="10"/><rect x="1070" y="1080" width="470" height="68" rx="10" stroke="#a46851"/>
  </g>
  <text x="82" y="958" class="chord">A</text><text x="205" y="958" class="action">External view</text>
  <text x="82" y="1040" class="chord">X</text><text x="205" y="1040" class="action">HUD toggle</text>
  <text x="82" y="1122" class="chord">Y</text><text x="205" y="1122" class="action">Max normal thrust</text>
  <text x="587" y="958" class="chord">RB</text><text x="710" y="958" class="action">Afterburner</text>
  <text x="587" y="1040" class="chord">LB</text><text x="710" y="1040" class="action">Idle thrust</text>
  <text x="587" y="1122" class="chord">D-PAD ↑</text><text x="750" y="1122" class="action">Zoom in</text>
  <text x="1092" y="958" class="chord">D-PAD ↓</text><text x="1255" y="958" class="action">Zoom out</text>
  <text x="1092" y="1040" class="chord">B</text><text x="1215" y="1040" class="action">Rescue pod</text>
  <text x="1092" y="1122" class="chord">R3 CLICK</text><text x="1255" y="1122" class="action">Eject</text>
  <text x="60" y="1182" class="small">L3 / R3 = press the stick. Return the look stick to centre before choosing another direction.</text>
  <text x="1540" y="1182" class="small" text-anchor="end">RETRO FOUNDRY</text>
</svg>
