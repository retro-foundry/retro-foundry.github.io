<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title description">
  <title id="title">F/A-18 Interceptor gamepad controls</title>
  <desc id="description">Two views of an Xbox-style gamepad. The top view separates the rear LT/L2 and RT/R2 triggers for rudder from the front LB/L and RB/R bumpers for throttle. The front view highlights the small centre buttons: left Select/View, tap for map or hold for combinations; right Start/Menu, pause or resume. Left stick pitch and roll, click for gear. A fire, B flare, X target, Y weapon. D-pad up radar, down brake, left chaff, right ECM. Right stick cockpit look, click for hook. Hold Select/View with A external view, X HUD, Y maximum normal thrust, RB afterburner, LB idle, D-pad up zoom in, down zoom out, B rescue pod, or right stick click eject. Face-button letters use Xbox/X-input names.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#344658"/><stop offset="1" stop-color="#192738"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b2938"/><stop offset="1" stop-color="#101c29"/>
    </linearGradient>
    <radialGradient id="stick">
      <stop stop-color="#43576b"/><stop offset=".7" stop-color="#293c50"/><stop offset="1" stop-color="#172536"/>
    </radialGradient>
    <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .heading { fill: #f4f7fc; font-weight: 700; font-size: 26px; letter-spacing: 1px; }
      .label { fill: #e2eaf4; font-size: 25px; }
      .note { fill: #9eafc3; font-size: 21px; }
      .small { fill: #a9bbce; font-size: 18px; }
      .leader { fill: none; stroke: #617e99; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .key { fill: #edf5ff; font-weight: 700; font-size: 22px; text-anchor: middle; }
      .pad-label { fill: #c2d3e5; font-weight: 700; font-size: 20px; text-anchor: middle; }
      .chord { fill: #ffbf69; font-weight: 700; font-size: 21px; }
      .action { fill: #eef3fb; font-size: 26px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1600" height="1400" rx="24" fill="#0a111c"/>
  <path d="M40 110H1560M40 390H1560M40 1050H1560" stroke="#26364b" stroke-width="2"/>
  <text x="60" y="58" fill="#ffbf69" font-size="22" font-weight="700" letter-spacing="4">F/A-18 INTERCEPTOR</text>
  <text x="60" y="96" fill="#f3f7ff" font-size="32" font-weight="700">GAMEPAD CONTROLS</text>
  <text x="1540" y="82" class="note" text-anchor="end">Xbox-style default profile</text>

  <!-- Top view: triggers sit behind the thin front shoulder bumpers. -->
  <text x="800" y="146" class="small" text-anchor="middle" letter-spacing="3">TOP VIEW · SAME LEFT / RIGHT AS WHEN PLAYING</text>
  <path d="M448 234Q800 205 1152 234L1180 337Q800 363 420 337Z" fill="url(#body)" stroke="#667f98" stroke-width="3"/>
  <g fill="#403521" stroke="#ffbf69" stroke-width="3">
    <path d="M474 232V188Q474 170 492 170H590Q608 170 608 188V232Z"/>
    <path d="M992 232V188Q992 170 1010 170H1108Q1126 170 1126 188V232Z"/>
  </g>
  <g fill="#173b48" stroke="#7ed5e9" stroke-width="3">
    <rect x="448" y="285" width="212" height="43" rx="16"/>
    <rect x="940" y="285" width="212" height="43" rx="16"/>
  </g>
  <g text-anchor="middle" font-size="25" font-weight="700">
    <text x="541" y="211" fill="#ffcf8d">LT / L2</text>
    <text x="1059" y="211" fill="#ffcf8d">RT / R2</text>
    <text x="554" y="315" fill="#a3eafa">LB / L</text>
    <text x="1046" y="315" fill="#a3eafa">RB / R</text>
  </g>
  <text x="800" y="203" class="small" text-anchor="middle">REAR: TRIGGERS</text>
  <text x="800" y="313" class="small" text-anchor="middle">FRONT: BUMPERS</text>
  <g class="leader">
    <path d="M350 205H474" stroke="#ffbf69"/>
    <path d="M350 307H448" stroke="#7ed5e9"/>
    <path d="M1250 205H1126" stroke="#ffbf69"/>
    <path d="M1250 307H1152" stroke="#7ed5e9"/>
  </g>
  <text x="60" y="199" class="heading" style="fill:#ffcf8d">LT / L2</text>
  <text x="60" y="235" class="label">Rudder left</text>
  <text x="60" y="301" class="heading" style="fill:#a3eafa">LB / L</text>
  <text x="60" y="337" class="label">Throttle down</text>
  <text x="1250" y="199" class="heading" style="fill:#ffcf8d">RT / R2</text>
  <text x="1250" y="235" class="label">Rudder right</text>
  <text x="1250" y="301" class="heading" style="fill:#a3eafa">RB / R</text>
  <text x="1250" y="337" class="label">Throttle up</text>
  <text x="800" y="377" class="small" text-anchor="middle">Xbox: LB / RB and LT / RT · 8BitDo: L / R and L2 / R2</text>

  <!-- Front view with the centre buttons identified above the controller. -->
  <text x="60" y="445" class="small" letter-spacing="3">FRONT VIEW</text>

  <!-- Smooth front silhouette; shoulder anatomy is shown separately above. -->
  <g transform="translate(0 250)" filter="url(#shadow)">
    <path d="M605 294Q800 266 995 294Q1101 291 1134 394L1200 600Q1220 687 1161 710Q1118 726 1080 682L980 588Q800 640 620 588L520 682Q482 726 439 710Q380 687 400 600L466 394Q499 291 605 294Z" fill="url(#body)" stroke="#667f98" stroke-width="3"/>
    <path d="M466 480L419 616Q409 668 447 684Q469 694 494 665L574 578Z" fill="url(#grip)"/>
    <path d="M1134 480L1181 616Q1191 668 1153 684Q1131 694 1106 665L1026 578Z" fill="url(#grip)"/>
    <path d="M621 313Q800 289 979 313" fill="none" stroke="#809ab2" stroke-opacity=".35" stroke-width="2"/>

    <circle cx="604" cy="420" r="71" fill="#101c2a" stroke="#5c758e" stroke-width="2"/>
    <circle cx="604" cy="420" r="56" fill="url(#stick)" stroke="#7d99b2" stroke-width="3"/>
    <circle cx="604" cy="420" r="43" fill="none" stroke="#9ab2c6" stroke-opacity=".2" stroke-dasharray="2 5" stroke-width="3"/>
    <path d="M604 396V444M580 420H628" stroke="#9fb9d1" stroke-opacity=".6" stroke-width="2"/>
    <text x="604" y="504" class="pad-label">L3</text>

    <circle cx="710" cy="552" r="66" fill="#112030" stroke="#4b647c" stroke-width="2"/>
    <path d="M690 501H730V532H761V572H730V603H690V572H659V532H690Z" fill="#31475e" stroke="#809bb5" stroke-width="2"/>
    <path d="M704 516L710 509L716 516M704 588L710 595L716 588M674 546L667 552L674 558M746 546L753 552L746 558" fill="none" stroke="#c1d2e3" stroke-width="2"/>

    <circle cx="960" cy="552" r="71" fill="#101c2a" stroke="#5c758e" stroke-width="2"/>
    <circle cx="960" cy="552" r="56" fill="url(#stick)" stroke="#7d99b2" stroke-width="3"/>
    <circle cx="960" cy="552" r="43" fill="none" stroke="#9ab2c6" stroke-opacity=".2" stroke-dasharray="2 5" stroke-width="3"/>
    <path d="M960 528V576M936 552H984" stroke="#9fb9d1" stroke-opacity=".6" stroke-width="2"/>
    <text x="960" y="636" class="pad-label">R3</text>

    <g stroke-width="2">
      <circle cx="1018" cy="357" r="26" fill="#422e14" stroke="#f7ca64"/>
      <circle cx="966" cy="409" r="26" fill="#173957" stroke="#76bbfa"/>
      <circle cx="1070" cy="409" r="26" fill="#4d2430" stroke="#f68e99"/>
      <circle cx="1018" cy="461" r="26" fill="#1b4339" stroke="#8ed8ad"/>
    </g>
    <text x="1018" y="365" class="key" style="fill:#f7ca64">Y</text>
    <text x="966" y="417" class="key" style="fill:#76bbfa">X</text>
    <text x="1070" y="417" class="key" style="fill:#f68e99">B</text>
    <text x="1018" y="469" class="key" style="fill:#8ed8ad">A</text>

    <rect x="726" y="356" width="68" height="50" rx="14" fill="#403521" stroke="#ffbf69" stroke-width="3"/>
    <path d="M747 381H773" stroke="#ffe0ae" stroke-width="4" stroke-linecap="round"/>
    <text x="760" y="430" fill="#ffe0ae" font-size="16" text-anchor="middle" font-weight="700">SELECT</text>
    <rect x="806" y="356" width="68" height="50" rx="14" fill="#173b48" stroke="#7ed5e9" stroke-width="3"/>
    <path d="M827 381H853M840 368V394" stroke="#b1f0fc" stroke-width="4" stroke-linecap="round"/>
    <text x="840" y="430" fill="#b1f0fc" font-size="16" text-anchor="middle" font-weight="700">START</text>
    <circle cx="800" cy="320" r="15" fill="#101c29" stroke="#6c8298"/>
    <path d="M800 309L803 317L813 322V325L802 323V330L800 328L798 330V323L787 325V322L797 317Z" fill="#ffbf69"/>
  </g>

  <!-- Draw these leaders after the body so every endpoint stays visible. -->
  <g class="leader">
    <path d="M350 653H515L533 670"/>
    <path d="M350 738H510L550 715"/>
    <path d="M350 847H578L644 802"/>
    <path d="M1210 685H1155"/>
    <path d="M1210 855H1100L1031 802"/>
  </g>
  <g class="leader" stroke-width="3">
    <path d="M660 510L760 536V603" stroke="#ffbf69"/>
    <path d="M940 510L840 536V603" stroke="#7ed5e9"/>
  </g>
  <circle cx="760" cy="603" r="5" fill="#ffbf69"/>
  <circle cx="840" cy="603" r="5" fill="#7ed5e9"/>
  <rect x="530" y="420" width="260" height="90" rx="12" fill="#251f17" stroke="#ffbf69" stroke-width="2"/>
  <rect x="810" y="420" width="260" height="90" rx="12" fill="#102831" stroke="#7ed5e9" stroke-width="2"/>
  <text x="660" y="455" fill="#ffcf8d" font-size="25" font-weight="700" text-anchor="middle">SELECT / VIEW</text>
  <text x="660" y="490" class="label" text-anchor="middle">Tap: map</text>
  <text x="940" y="455" fill="#a3eafa" font-size="25" font-weight="700" text-anchor="middle">START / MENU</text>
  <text x="940" y="490" class="label" text-anchor="middle">Pause / resume</text>

  <!-- Normal flight actions. -->
  <text x="60" y="620" class="heading">LEFT STICK</text>
  <text x="60" y="660" class="label">Pitch / roll</text>
  <text x="60" y="695" class="small">Push forward: nose down</text>
  <text x="60" y="742" class="heading">L3</text><text x="124" y="742" class="label">Toggle gear</text>
  <text x="60" y="810" class="heading">D-PAD</text>
  <text x="60" y="850" class="label">↑ Radar range</text>
  <text x="60" y="888" class="label">↓ Brake / airbrake</text>
  <text x="60" y="926" class="label">← Chaff</text>
  <text x="60" y="964" class="label">→ ECM</text>

  <g font-size="25" font-weight="700" text-anchor="middle" transform="translate(0 250)">
    <circle cx="1245" cy="352" r="20" fill="#422e14"/><text x="1245" y="361" fill="#f7ca64">Y</text>
    <circle cx="1245" cy="399" r="20" fill="#173957"/><text x="1245" y="408" fill="#76bbfa">X</text>
    <circle cx="1245" cy="446" r="20" fill="#4d2430"/><text x="1245" y="455" fill="#f68e99">B</text>
    <circle cx="1245" cy="493" r="20" fill="#1b4339"/><text x="1245" y="502" fill="#8ed8ad">A</text>
  </g>
  <text x="1280" y="611" class="label">Cycle weapon</text>
  <text x="1280" y="658" class="label">Next target</text>
  <text x="1280" y="705" class="label">Flare</text>
  <text x="1280" y="752" class="label">Fire (hold)</text>
  <text x="1210" y="855" class="heading">RIGHT STICK</text>
  <text x="1210" y="891" class="label">Cockpit look</text>
  <text x="1210" y="927" class="label">Click R3: toggle hook</text>
  <text x="1210" y="963" class="small">↑ Forward · ↓ Rear</text>
  <text x="1210" y="991" class="small">← Left · → Right</text>

  <!-- Less frequent commands: explicit chords, kept off the flight HUD. -->
  <g transform="translate(0 200)">
  <text x="60" y="887" fill="#ffbf69" font-size="29" font-weight="700">HOLD SELECT / VIEW +</text>
  <text x="1540" y="884" class="note" text-anchor="end">Hold the left centre button, then press another control.</text>
  <g fill="#131f2e" stroke="#2b4055">
    <rect x="60" y="916" width="470" height="68" rx="10"/><rect x="565" y="916" width="470" height="68" rx="10"/><rect x="1070" y="916" width="470" height="68" rx="10"/>
    <rect x="60" y="998" width="470" height="68" rx="10"/><rect x="565" y="998" width="470" height="68" rx="10"/><rect x="1070" y="998" width="470" height="68" rx="10"/>
    <rect x="60" y="1080" width="470" height="68" rx="10"/><rect x="565" y="1080" width="470" height="68" rx="10"/><rect x="1070" y="1080" width="470" height="68" rx="10" stroke="#a46851"/>
  </g>
  <text x="82" y="958" class="chord">A</text><text x="205" y="958" class="action">External view</text>
  <text x="82" y="1040" class="chord">X</text><text x="205" y="1040" class="action">HUD toggle</text>
  <text x="82" y="1122" class="chord">Y</text><text x="205" y="1122" class="action">Max normal thrust</text>
  <text x="587" y="958" class="chord">RB</text><text x="710" y="958" class="action">Afterburner</text>
  <text x="587" y="1040" class="chord">LB</text><text x="710" y="1040" class="action">Idle thrust</text>
  <text x="587" y="1122" class="chord">D-PAD ↑</text><text x="750" y="1122" class="action">Zoom in</text>
  <text x="1092" y="958" class="chord">D-PAD ↓</text><text x="1255" y="958" class="action">Zoom out</text>
  <text x="1092" y="1040" class="chord">B</text><text x="1215" y="1040" class="action">Rescue pod</text>
  <text x="1092" y="1122" class="chord">R3 CLICK</text><text x="1255" y="1122" class="action">Eject</text>
  </g>
  <text x="60" y="1382" class="small">L3 / R3 = press the stick · Face buttons use Xbox / X-input names.</text>
  <text x="1540" y="1382" class="small" text-anchor="end">RETRO FOUNDRY</text>
</svg>
