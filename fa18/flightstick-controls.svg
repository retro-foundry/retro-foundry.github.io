<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" role="img" aria-labelledby="title desc"><title id="title">F/A-18 Interceptor FLIGHT STICK + ANALOG THROTTLE</title><desc id="desc">Generic flight hardware layout, analog pitch, roll, twist rudder and throttle from idle to maximum normal thrust. Learn the actual axes and hat in the launcher. A separate USB throttle is supported. Numbered button preset and button 7 modifier combinations are listed below; physical positions vary by model.</desc>
<defs><linearGradient id="body" x2="0" y2="1"><stop stop-color="#344658"/><stop offset="1" stop-color="#192738"/></linearGradient><style>text{font-family:Segoe UI,Arial,sans-serif}.h{fill:#f4f7fc;font-size:26px;font-weight:700}.t{fill:#e2eaf4;font-size:24px}.s{fill:#a9bbce;font-size:19px}.line{fill:none;stroke:#7ed5e9;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.key{fill:#ffbf69;font-size:24px;font-weight:700}</style></defs>
<rect width="1600" height="1450" rx="24" fill="#0a111c"/><path d="M40 115H1560M40 720H1560M40 1165H1560" stroke="#26364b" stroke-width="2"/>
<text x="60" y="55" fill="#ffbf69" font-size="22" font-weight="700" letter-spacing="4">F/A-18 INTERCEPTOR</text>
<text x="60" y="98" class="h" style="font-size:32px">FLIGHT STICK + ANALOG THROTTLE</text>
<text x="60" y="155" class="s">Layout illustration &#183; physical button positions vary by model &#183; assign controls in the launcher</text>
<g transform="translate(230 200) scale(1)"><path d="M70 360Q25 370 20 435H420Q415 370 365 360Z" fill="url(#body)" stroke="#667f98" stroke-width="3"/><ellipse cx="220" cy="359" rx="80" ry="28" fill="#142132" stroke="#667f98" stroke-width="3"/><path d="M180 350L168 190Q135 163 148 93L174 55Q225 20 288 55L320 112L284 163L268 350Z" fill="url(#body)" stroke="#809bb5" stroke-width="3"/><path d="M166 145L130 168L128 213L169 198" fill="#6b3141" stroke="#f68e99" stroke-width="3"/><circle cx="235" cy="90" r="30" fill="#173b48" stroke="#7ed5e9" stroke-width="3"/><path d="M235 71V109M216 90H254" class="line"/><text x="235" y="145" class="s" text-anchor="middle">POV HAT</text><circle cx="295" cy="145" r="14" fill="#403521" stroke="#ffbf69" stroke-width="2"/><circle cx="258" cy="181" r="14" fill="#403521" stroke="#ffbf69" stroke-width="2"/><path d="M177 267Q220 235 264 267" class="line"/><path d="M177 267L182 253M177 267L194 270M264 267L247 270M264 267L259 253" class="line"/></g>
<path d="M540 568V644" stroke="#7ed5e9" stroke-width="12" stroke-linecap="round"/><rect x="519" y="581" width="42" height="28" rx="6" fill="#ffbf69"/>
<text x="810" y="365" class="h">STICK</text><text x="810" y="405" class="t">Sideways: roll &#183; forward / back: pitch</text><text x="810" y="445" class="s">Push forward: nose down &#183; pull back: nose up</text><path d="M790 399H670L520 395" class="line"/>
<text x="810" y="520" class="h">TWIST / PEDALS</text><text x="810" y="560" class="t">Analog rudder left / right</text><path d="M790 552H650L497 467" class="line"/>
<text x="810" y="245" class="h">POV HAT</text><text x="810" y="285" class="t">Cockpit look: forward / rear / left / right</text><path d="M790 278H640L495 290" class="line"/>
<text x="810" y="625" class="h">THROTTLE LEVER / SLIDER</text><text x="810" y="665" class="t">Idle &#8594; maximum normal thrust</text><path d="M790 635H680L563 595" class="line"/>
<text x="60" y="375" class="t">Trigger: fire</text><path d="M250 383H300L359 375" class="line"/>
<text x="60" y="700" class="s">Also supports modern sticks with integrated levers, such as VKB Gladiator, Ursa Minor and VelocityOne.</text>
<text x="60" y="765" class="h">NUMBERED BUTTON PRESET</text><text x="1540" y="765" class="s" text-anchor="end">Choose &quot;Use numbered button preset&quot;, or learn your preferred assignments.</text>
<rect x="60" y="786" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="82" y="818" class="key">01</text><text x="152" y="818" class="t">Fire (hold)</text>
<rect x="60" y="838" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="82" y="870" class="key">02</text><text x="152" y="870" class="t">Flare</text>
<rect x="60" y="890" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="82" y="922" class="key">03</text><text x="152" y="922" class="t">Next target</text>
<rect x="60" y="942" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="82" y="974" class="key">04</text><text x="152" y="974" class="t">Next weapon</text>
<rect x="60" y="994" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="82" y="1026" class="key">05</text><text x="152" y="1026" class="t">Throttle down</text>
<rect x="60" y="1046" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="82" y="1078" class="key">06</text><text x="152" y="1078" class="t">Throttle up</text>
<rect x="60" y="1098" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="82" y="1130" class="key">07</text><text x="152" y="1130" class="t">Map / hold modifier</text>
<rect x="830" y="786" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="852" y="818" class="key">08</text><text x="922" y="818" class="t">Pause / resume</text>
<rect x="830" y="838" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="852" y="870" class="key">09</text><text x="922" y="870" class="t">Gear</text>
<rect x="830" y="890" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="852" y="922" class="key">10</text><text x="922" y="922" class="t">Arrestor hook</text>
<rect x="830" y="942" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="852" y="974" class="key">11</text><text x="922" y="974" class="t">Radar range</text>
<rect x="830" y="994" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="852" y="1026" class="key">12</text><text x="922" y="1026" class="t">Brake / airbrake</text>
<rect x="830" y="1046" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="852" y="1078" class="key">13</text><text x="922" y="1078" class="t">Chaff</text>
<rect x="830" y="1098" width="710" height="46" rx="7" fill="#131f2e" stroke="#2b4055"/><text x="852" y="1130" class="key">14</text><text x="922" y="1130" class="t">ECM</text>
<text x="60" y="1203" class="key">HOLD BUTTON 7 +</text><text x="1540" y="1203" class="s" text-anchor="end">Press the modifier first &#183; a combination will not open the map</text>
<rect x="60" y="1220" width="470" height="50" rx="8" fill="#131f2e" stroke="#2b4055"/><text x="78" y="1253" class="key">1</text><text x="187" y="1253" class="t">External view</text>
<rect x="565" y="1220" width="470" height="50" rx="8" fill="#131f2e" stroke="#2b4055"/><text x="583" y="1253" class="key">3</text><text x="692" y="1253" class="t">HUD toggle</text>
<rect x="1070" y="1220" width="470" height="50" rx="8" fill="#131f2e" stroke="#2b4055"/><text x="1088" y="1253" class="key">4</text><text x="1197" y="1253" class="t">Max normal thrust</text>
<rect x="60" y="1279" width="470" height="50" rx="8" fill="#131f2e" stroke="#2b4055"/><text x="78" y="1312" class="key">6</text><text x="187" y="1312" class="t">Afterburner</text>
<rect x="565" y="1279" width="470" height="50" rx="8" fill="#131f2e" stroke="#2b4055"/><text x="583" y="1312" class="key">5</text><text x="692" y="1312" class="t">Idle thrust</text>
<rect x="1070" y="1279" width="470" height="50" rx="8" fill="#131f2e" stroke="#2b4055"/><text x="1088" y="1312" class="key">11 / 12</text><text x="1197" y="1312" class="t">Zoom in / out</text>
<rect x="60" y="1338" width="470" height="50" rx="8" fill="#131f2e" stroke="#2b4055"/><text x="78" y="1371" class="key">2</text><text x="187" y="1371" class="t">Rescue pod</text>
<rect x="565" y="1338" width="470" height="50" rx="8" fill="#131f2e" stroke="#2b4055"/><text x="583" y="1371" class="key">10</text><text x="692" y="1371" class="t">Eject</text>
<text x="60" y="1425" class="s">Only present buttons are assigned. Custom assignments are shown in setup. Afterburner is a separate command.</text><text x="1540" y="1425" class="s" text-anchor="end">RETRO FOUNDRY</text></svg>
